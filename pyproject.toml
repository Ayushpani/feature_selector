[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-engine-pro"
version = "0.1.4"
description = "A professional, enterprise-grade feature selection and engineering pipeline."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Feature Engine Pro Team"}
]
dependencies = [
    "pandas>=1.0.0",
    "numpy>=1.18.0",
    "scikit-learn>=0.24.0",
    "joblib>=1.0.0",
    "plotly>=5.0.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
    "playwright>=1.15.0",
    "nest-asyncio>=1.5.0",
]

[project.optional-dependencies]
test = ["pytest>=6.0.0"]

[tool.setuptools]
packages = ["feature_engine_pro", "feature_engine_pro.transformers", "feature_engine_pro.selectors"]
