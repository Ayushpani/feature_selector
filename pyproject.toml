[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-engine-pro"
version = "2.0.0"
description = "Industry-grade automated feature engineering and mathematically rigorous feature selection for Python."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Ayush Pani"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "scipy>=1.10.0",
    "joblib>=1.2.0",
]

[project.optional-dependencies]
explain = ["shap>=0.42.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "shap>=0.42.0",
]

[project.urls]
Repository = "https://github.com/AyushPani/feature_selector"

[tool.setuptools.packages.find]
include = ["feature_engine_pro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
